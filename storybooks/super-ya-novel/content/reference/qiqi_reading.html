function renderChoices(q,a,idx){if(q.type==='choice'){return `<div class="choices">${q.options.map((o,i)=>{const chosen=a?.selection===i;return `<button class="answer-choice ${a?.correct&&chosen?'good':(!a?.correct&&chosen&&a?.wrong?'bad':'')}" data-pick="${i}" ${recordDone(a)?'disabled':''}><span class="choice-letter">${'ABC'[i]}</span><span>${eHtml(o)}</span></button>`}).join('')}</div>`}return `<p class="sentence-hint">找一找原文。可以先看段落編號，再點選最有力的一段證據。</p><div class="choices">${passage().map((p,i)=>{const chosen=a?.selection===i;return `<button class="answer-choice evidence-option ${a?.correct&&chosen?'good':(!a?.correct&&chosen&&a?.wrong?'bad':'')}" data-pick="${i}" ${recordDone(a)?'disabled':''}><span class="choice-letter">${i+1}</span><span>${eHtml(p.length>73?p.slice(0,73)+'……':p)}</span></button>`}).join('')}</div>`}
function practiceView(){const qs=questions();const idx=getPos(),total=qs.length;const dots=qs.map((q,i)=>{let a=st.attempts[qid(i)];return `<span class="step-dot ${recordDone(a)?'done':''} ${idx===i?'current':''}"></span>`}).join('');if(idx>=total){let note=st.notes[key()]||'';return `<aside class="practice-panel" aria-label="理解練習"><span class="practice-eyebrow">這一段的練習</span><div class="practice-stepper">${dots}</div><div class="finished-icon">🌿</div><div class="finished-title">這一段先讀到這裡</div><p class="finished-text">你可以重新看看原文，也可以把自己讀懂的意思說一說。這不是考試，不需要寫出跟巧虎一模一樣的話。</p><div class="reflection"><h4>✏️ 試著用自己的話說</h4><p>${eHtml(currentScene().reflection)}</p><textarea id="ownNote" maxlength="1000" aria-label="用自己的話說" placeholder="寫一句也可以，或用 iPad 鍵盤的麥克風說出來……">${eHtml(note)}</textarea><div class="reflection-buttons"><button class="btn mini" data-save-note>留下我的想法</button></div><div class="under-note">自由表達不會自動評分；可以跟大人一起討論不同的說法。</div></div><div class="nav-questions"><button class="btn mini" data-prev>← 回上一題</button><button class="btn mini ghost" data-restart>再練這段 ↻</button><button class="btn main-btn" ${st.level==='extra'?'data-next-scene':'data-next-level'}>${st.level==='extra'?'下一個故事 →':'挑戰想法短文 →'}</button></div></aside>`}
const q=qs[idx];const a=st.attempts[qid(idx)]||null;const done=recordDone(a);let feedback='';if(done){const independent=a.correct&&a.tries===1&&a.hints===0;feedback=`<div class="feedback good"><strong>${a.correct?(independent?'你自己找到了！':'你找到有根據的答案了！'):'你已經看過說明了。'}</strong><div class="explain-box">${eHtml(q.why)}<br><span class="under-note">文章線索：第 ${q.evidence.map(i=>i+1).join('、')} 段。</span></div></div>`}else if(a?.wrong){feedback='<div class="feedback">這個答案和文章最直接的線索還不太一樣。別急，回原文看看，也可以打開提示，再試一次。</div>'}
const h=a?.hints||0;const hints=[];if(h>=1)hints.push(`<div class="hint-card"><div class="hint-heading">第一個小提示</div>${eHtml(q.hints[0])}</div>`);if(h>=2)hints.push(`<div class="hint-card"><div class="hint-heading">再多一點線索</div>${eHtml(q.hints[1])}</div>`);if(h>=3)hints.push(`<div class="hint-card"><div class="hint-heading">回文章找找</div>可以先看原文的第 ${q.evidence.map(i=>i+1).join('、')} 段。<button class="btn mini ghost" data-jump-evidence>帶我看看這段 ↗</button></div>`);
const stepBtn=!done?`<div class="help-actions">${h<3?`<button class="btn mini" data-hint>${h===0?'給我一點小提示':h===1?'再多一點提示':'幫我找文章線索'}</button>`:''}<button class="btn mini ghost" data-reveal>我想先看說明</button></div>`:'';
return `<aside class="practice-panel" aria-label="理解練習"><div class="practice-eyebrow">${st.level==='story'?'故事理解':'想法短文'} · 第 ${idx+1} / ${total} 題</div><div class="practice-progress"><h3>慢慢找到答案</h3><span class="tag quiet">${eHtml(q.skill)}</span></div><div class="practice-stepper">${dots}</div><div class="question-skill">先自己想想，再找文章的線索</div><div class="question">${eHtml(q.q)}</div>${renderChoices(q,a,idx)}${feedback}${hints.join('')}${stepBtn}<div class="nav-questions"><button class="btn mini" data-prev ${idx===0?'disabled':''}>← 上一題</button><button class="btn ${done?'main-btn':''}" data-next>${done?'下一題 →':'先往下一題 →'}</button></div><div class="under-note" style="margin-top:13px">不一定要第一次就答對。想不通時，練習回到文章找根據。</div></aside>`}
function reader(){const s=currentScene();const c=counts(s);return `<div class="read-top"><div class="reader-ident"><span class="icon-tile" style="--tile:${s.color}" aria-hidden="true">${s.icon}</span><div><h1>${st.scene+1<9?'第'+(st.scene+1)+'篇｜':''}${eHtml(s.title)}</h1><p>${eHtml(s.subtitle)} · 這個情境已完成 ${c.done}/${c.total} 個理解任務</p></div></div><div class="reader-commands"><button class="btn mini" data-home>← 回全部情境</button><button class="btn mini" data-speech-stop>■ 停止朗讀</button></div></div><div class="level-tabs" role="tablist" aria-label="閱讀難度"><button role="tab" aria-selected="${st.level==='story'}" class="${st.level==='story'?'sel':''}" data-level="story">① 故事閱讀 <small>3 題</small></button><button role="tab" aria-selected="${st.level==='extra'}" class="${st.level==='extra'?'sel':''}" data-level="extra">② 想法短文 <small>2 題</small></button></div><div class="reader-layout-note">${st.phase==='read'?'先看原文就好，讀完再開始練習。': '可以回頭找左邊／上方的文章，答案應該找得到線索。'}</div><div class="reading-grid ${st.phase==='practice'?'in-practice':''}">${paperView(s)}${st.phase==='practice'?practiceView():''}</div>`}
function parentView(){const stats=tally();const rows=BOOK.scenes.map(s=>{const c=counts(s);return `<tr><td>${eHtml(s.title)}</td><td>${c.done}/${c.total}</td><td>${c.alone}</td></tr>`}).join('');return `<div class="read-top"><div class="reader-ident"><span class="icon-tile" style="--tile:#e6efe0">🧭</span><div><h1>給一起閱讀的大人</h1><p>看看孩子需要什麼協助，不把分數當成閱讀能力的全部</p></div></div><button class="btn" data-home>← 回到閱讀</button></div><div class="parent-layout"><section class="adult-card"><h2>孩子目前的閱讀足跡</h2><div class="stat-grid"><div class="stat"><strong>${stats.done}</strong><span>已讀懂／看過說明</span></div><div class="stat"><strong>${stats.alone}</strong><span>第一次自行找到</span></div><div class="stat"><strong>${stats.withHelp+stats.explained}</strong><span>提示或說明協助</span></div></div><p>共 ${TOTAL} 個選擇或找證據任務。這些數字只是幫家長發現「哪些地方需要再陪一下」，不是能力排名，也不是學習成績單。</p></section><section class="adult-card"><h2>怎麼陪讀更有效？</h2><ol><li>每天挑一個情境，先讓孩子自己讀，別急著解釋。</li><li>孩子不懂時先問「哪一句讓你這樣想？」再使用第一個提示。</li><li>答錯時陪他回原文找線索，不必快速告訴答案。</li><li>自由回答可以有不同表達；大人多聽，少急著糾正。</li><li>先會自己讀懂，再逐步減少提示。深度的價值討論留給另一份「時光悄悄話」。</li></ol></section><section class="adult-card wide"><h2>各篇進度</h2><table class="adult-table"><thead><tr><th>故事情境</th><th>完成任務</th><th>自行找到</th></tr></thead><tbody>${rows}</tbody></table></section><section class="adult-card"><h2>資料備份</h2><p>練習紀錄與孩子打下的文字，預設只存在這個瀏覽器。換裝置、清除 Safari 網站資料或某些直接開檔方式，可能無法保留紀錄。可自行下載備份，再匯入另一台裝置。</p><div class="adult-actions"><button class="btn" data-export>⬇ 下載進度備份</button><label class="btn" for="fileImport">⬆ 匯入進度備份</label><input id="fileImport" class="sr-only" type="file" accept="application/json,.json"></div></section><section class="adult-card"><h2>關於本系統</h2><p>故事文字取自先前完成的《琪琪被罵了》正式稿。「那一天」保留原段落；進階短文則取自「巧虎的時光悄悄話」之連續原文段落。</p><p>題目與提示是事先撰寫、根據文章自動檢查的練習，不是 AI 語意評分。自由輸入內容不打分。瀏覽器語音是裝置提供的朗讀，並非原動畫配音。</p><button class="btn mini" data-reset>清除本機練習紀錄</button></section></div>`}
function render(){document.documentElement.style.setProperty('--fsize',Math.min(1.3,Math.max(.86,Number(st.settings.scale)||1)));el.innerHTML=st.view==='home'?home():st.view==='reader'?reader():parentView();document.getElementById('header-home').setAttribute('aria-pressed',String(st.view==='home'));save()}
function renderKeep(){const y=window.scrollY;render();window.scrollTo(0,y)}
function scrollPractice(){let target=document.querySelector('.practice-panel');if(target)target.scrollIntoView({block:'start',behavior:'smooth'})}
function answerPick(i){const idx=getPos(),q=questions()[idx],id=qid(idx),a=attempt(id);if(recordDone(a))return;a.tries+=1;a.selection=i;const good=(i===q.correct);if(good){a.correct=true;a.wrong=false;toast(a.tries===1&&a.hints===0?'你找到文章的線索了！':'你慢慢找到有根據的答案了！')}else{a.wrong=true;toast('再看看文章的線索，還可以試一次。')}save();renderKeep();if(good&&q.evidence.length){document.querySelectorAll('.para.proof').forEach(x=>x.classList.remove('proof'));const p=document.getElementById('para-'+q.evidence[0]);p?.classList.add('proof')}}
function nextQuestion(){const n=getPos();st.position[key()]=Math.min(questions().length,n+1);save();renderKeep();scrollPractice()}
function prevQuestion(){const n=getPos();if(n>0)st.position[key()]=n-1;save();renderKeep();scrollPractice()}
function showHint(){const a=attempt(qid(getPos()));a.hints=Math.min(3,a.hints+1);save();renderKeep()}
function reveal(){const a=attempt(qid(getPos()));a.revealed=true;save();renderKeep();toast('可以看看說明，再回到文章對一對。')}
function jumpEvidence(){const idx=getPos(),q=questions()[idx];q.evidence.forEach(k=>document.getElementById('para-'+k)?.classList.add('proof'));document.getElementById('para-'+q.evidence[0])?.scrollIntoView({behavior:'smooth',block:'center'})}
function showModal(inner){modal.innerHTML=`<div class="panel-overlay" id="overlayBackdrop"><div class="drawer" role="dialog" aria-modal="true" aria-label="閱讀輔助">${inner}</div></div>`;modal.classList.remove('hidden');document.getElementById('modal-close')?.focus()}
function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}
function wordModal(w){const item=GLOSSARY[w];if(!item)return;showModal(`<div class="drawer-top"><h2>${eHtml(w)}</h2><button class="overlay-close" id="modal-close" aria-label="關閉">✕</button></div><div class="bopo">${eHtml(item[0])}</div><div class="meaning"><p>${eHtml(item[1])}</p></div><p class="setting-description">這裡是詞語求助。看懂意思以後，可以再讀一次原文。</p><button class="btn mini" data-speakword="${eHtml(w)}">🔊 聽這個詞</button>`)}
function settingsModal(){showModal(`<div class="drawer-top"><h2>閱讀小工具</h2><button class="overlay-close" id="modal-close" aria-label="關閉">✕</button></div><p>可以調整字體大小、開關難字提示。這些工具只在需要時使用。</p><div class="settings-section"><h3>文字大小</h3><div class="settings-grid"><button class="btn mini" data-font="-.1">Ａ－</button><span class="tag quiet">目前 ${Math.round((st.settings.scale||1)*100)}%</span><button class="btn mini" data-font="+.1">Ａ＋</button><button class="btn mini ghost" data-font="reset">恢復大小</button></div></div><div class="settings-section"><h3>詞語求助</h3><div class="settings-grid"><button class="btn mini ${st.settings.terms?'main-btn':''}" data-terms>${st.settings.terms?'✓ 點詞語可以看注音與意思':'○ 開啟詞語提示'}</button></div><p class="setting-description">本版針對比較可能卡住的詞語提供台灣注音。這不是全文自動標注注音，以免多音字判讀錯誤。</p></div><div class="settings-section"><h3>語音朗讀</h3><p class="setting-description">使用裝置內建的中文語音；不是原動畫角色的聲音。能否朗讀取決於 iPad / 瀏覽器是否提供可用語音。文字會標出正在讀的段落，但不保證逐字高亮。</p><button class="btn mini" data-speech-stop>停止朗讀</button></div>`)}
function stopSpeech(){speechBatch++;try{window.speechSynthesis?.cancel()}catch(e){}document.querySelectorAll('.para.speaking').forEach(x=>x.classList.remove('speaking'))}
function loadVoices(){if(!('speechSynthesis'in window))return;voices=window.speechSynthesis.getVoices()||[]}
if('speechSynthesis'in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,ix){if(!('speechSynthesis'in window)){toast('這個瀏覽器目前不支援語音朗讀。');return false}stopSpeech();let id=speechBatch;const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.84;u.pitch=1;const zhTW=voices.find(v=>/zh[-_]TW/i.test(v.lang)),zh=voices.find(v=>/^zh/i.test(v.lang));if(zhTW)u.voice=zhTW;else if(zh)u.voice=zh;u.onstart=()=>{if(id!==speechBatch)return;if(ix!==undefined)document.getElementById('para-'+ix)?.classList.add('speaking')};u.onend=()=>{if(id!==speechBatch)return;document.querySelectorAll('.para.speaking').forEach(x=>x.classList.remove('speaking'))};u.onerror=()=>{document.querySelectorAll('.para.speaking').forEach(x=>x.classList.remove('speaking'));toast('目前無法使用裝置語音，可以先自己閱讀。')};try{window.speechSynthesis.speak(u);return true}catch(e){toast('目前無法使用語音朗讀。');return false}}
function speakAll(){if(!('speechSynthesis'in window)){toast('這個瀏覽器目前不支援語音。');return}stopSpeech();const id=speechBatch;let i=0;function run(){if(id!==speechBatch||i>=passage().length)return;const j=i++;const u=new SpeechSynthesisUtterance(passage()[j]);u.lang='zh-TW';u.rate=.84;const zhTW=voices.find(v=>/zh[-_]TW/i.test(v.lang)),zh=voices.find(v=>/^zh/i.test(v.lang));if(zhTW)u.voice=zhTW;else if(zh)u.voice=zh;u.onstart=()=>{if(id===speechBatch)document.getElementById('para-'+j)?.classList.add('speaking')};u.onend=()=>{document.getElementById('para-'+j)?.classList.remove('speaking');run()};u.onerror=()=>{document.getElementById('para-'+j)?.classList.remove('speaking')};window.speechSynthesis.speak(u)}try{run()}catch(e){toast('裝置目前無法朗讀文章。')}}
function saveNote(){const v=document.getElementById('ownNote')?.value||'';st.notes[key()]=v.trim();save();toast('這段話已留在本機閱讀紀錄。')}
function exportBackup(){const content=JSON.stringify({app:'qiqi-reading-v1',exportedAt:new Date().toISOString(),progress:{scene:st.scene,lastScene:st.lastScene,level:st.level,position:st.position,attempts:st.attempts,notes:st.notes,settings:st.settings}},null,2);const blob=new Blob([content],{type:'application/json;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='琪琪被罵了_閱讀理解進度備份.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function importBackup(file){if(!file)return;if(file.size>1000000){toast('檔案太大，請使用本系統匯出的備份。');return}try{const x=JSON.parse(await file.text());if(x.app!=='qiqi-reading-v1'||!x.progress||typeof x.progress!=='object')throw Error('format');if(!confirm('要使用這份備份取代本機目前的閱讀進度嗎？'))return;st=hydrate({...x.progress,view:'home',phase:'read'});save();render();topScroll();toast('已匯入備份進度。')}catch(e){toast('無法讀取備份，請選擇本系統匯出的 JSON 檔案。')}}
function resetData(){if(confirm('確定清除這台裝置的練習進度與孩子留下的文字嗎？這個動作不能還原，建議先備份。')){st=hydrate({...base,view:'home'});save();render();topScroll();toast('已清除本機紀錄。')}}
// Delegated controls work after re-render, and keep the HTML file fully offline.
document.addEventListener('click',(ev)=>{const b=ev.target.closest('button');if(!b){if(ev.target.id==='overlayBackdrop')closeModal();return}if(b.id==='header-home'||b.dataset.home!==undefined){gotoHome();return}if(b.id==='header-tools'){settingsModal();return}if(b.id==='header-adults'||b.dataset.adults!==undefined){stopSpeech();st.view='parent';save();render();topScroll();return}if(b.id==='modal-close'){closeModal();return}if(b.dataset.open!==undefined){const i=Number(b.dataset.open);const s=BOOK.scenes[i];openScene(i,'story',counts(s).done?'practice':'read');return}if(b.dataset.resume!==undefined){openScene(st.lastScene||0,st.level||'story',st.lastScene||tally().done?'practice':'read');return}if(b.dataset.level){stopSpeech();st.level=b.dataset.level;st.phase='read';save();render();topScroll();return}if(b.dataset.begin!==undefined){st.phase='practice';save();render();scrollPractice();return}if(b.dataset.readonly!==undefined){st.phase='read';save();render();topScroll();return}if(b.dataset.pick!==undefined){answerPick(Number(b.dataset.pick));return}if(b.dataset.hint!==undefined){showHint();return}if(b.dataset.reveal!==undefined){reveal();return}if(b.dataset.jumpEvidence!==undefined){jumpEvidence();return}if(b.dataset.next!==undefined){nextQuestion();return}if(b.dataset.prev!==undefined){prevQuestion();return}if(b.dataset.nextLevel!==undefined){st.level='extra';st.phase='read';save();render();topScroll();return}if(b.dataset.nextScene!==undefined){openScene((st.scene+1)%BOOK.scenes.length,'story');return}if(b.dataset.saveNote!==undefined){saveNote();return}if(b.dataset.restart!==undefined){if(confirm('要重新練習這段的題目嗎？這段的答題紀錄會重新開始，你自己寫的想法會保留。')){const ks=key();questions().forEach((q,i)=>delete st.attempts[ks+':q'+i]);st.position[ks]=0;save();renderKeep();scrollPractice()}return}if(b.dataset.tts!==undefined){speak(passage()[+b.dataset.tts],+b.dataset.tts);return}if(b.dataset.speakall!==undefined){speakAll();return}if(b.dataset.speakword){speak(b.dataset.speakword);return}if(b.dataset.speechStop!==undefined){stopSpeech();toast('朗讀已停止。');return}if(b.dataset.word){wordModal(b.dataset.word);return}if(b.dataset.font!==undefined){const x=b.dataset.font;st.settings.scale=x==='reset'?1:Math.max(.86,Math.min(1.3,Math.round((st.settings.scale+Number(x))*100)/100));save();settingsModal();renderKeep();return}if(b.dataset.terms!==undefined){st.settings.terms=!st.settings.terms;save();settingsModal();renderKeep();return}if(b.dataset.export!==undefined){exportBackup();return}if(b.dataset.reset!==undefined){resetData();return}});
document.addEventListener('change',ev=>{if(ev.target.id==='fileImport')importBackup(ev.target.files?.[0])});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
render();
</script>
